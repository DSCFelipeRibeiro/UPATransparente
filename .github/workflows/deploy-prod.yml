name: Promote to PROD

on:
  workflow_dispatch:
    inputs:
      backup_reference:
        description: Reference for the verified private backups required by the UPA operating procedure
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upatransparente-deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install -r DEV/app/requirements.txt
      - run: python -m py_compile DEV/app/app.py DEV/app/create_operator.py
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require backup reference
        env:
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: test -n "$BACKUP_REFERENCE"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Copy application and restart UPA PROD
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          rsync -az \
            --exclude='.env' --exclude='.env.*' --exclude='venv/' \
            --exclude='__pycache__/' --exclude='*.py[cod]' \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            DEV/app/ "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/upatransparente-prod/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo systemctl restart upatransparente-prod.service && sudo systemctl is-active --quiet upatransparente-prod.service'
